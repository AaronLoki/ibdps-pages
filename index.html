<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self'; connect-src 'self' https://jlasqtrtugmpoodottpb.supabase.co; form-action 'none'; base-uri 'none'">
  <title>Spanish ab initio</title>
  <link rel="stylesheet" href="/portal.css?activity=1">
  <script type="module" src="/app.js?activity=1"></script>
</head>
<body>
  <main class="login" id="login">
    <section class="login-panel">
      <p class="wordmark">Spanish ab initio</p>
      <h1>Sign in</h1>
      <form id="sign-in" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" maxlength="64" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="80" required>
        <button class="primary" type="submit">Sign in</button>
      </form>
      <p role="status" id="status"></p>
      <p class="activity-notice">The site owner can see sign-in times and the study pages and resources opened on this site.</p>
      <button class="quiet" id="request-access" type="button">Request access</button>
      <p id="request-status" role="status"></p>
      <form id="register" hidden>
        <label for="register-username">Choose a username</label>
        <input id="register-username" name="username" autocomplete="username" maxlength="64" required>
        <label for="register-password">Choose a password</label>
        <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="80" required>
        <button class="primary" type="submit">Register</button>
      </form>
      <noscript>Enable JavaScript to use the portal.</noscript>
    </section>
  </main>
  <section id="home" hidden>
    <header class="top">
      <a class="wordmark" href="/">Spanish ab initio</a>
      <div class="top-actions">
        <button class="quiet" type="button" id="show-admin" hidden>Admin</button>
        <button class="quiet" type="button" id="sign-out">Sign out</button>
      </div>
    </header>
    <main class="hub" id="resources">
      <h1>Study resources</h1>
      <nav class="resources" aria-label="Study resources">
        <a class="resource" href="/languageseven/"><span>LanguageSeven</span><span aria-hidden="true">↗</span></a>
      </nav>
    </main>
    <main class="hub" id="admin" hidden>
      <button class="quiet admin-back" type="button" id="close-admin">Back to resources</button>
      <h1 tabindex="-1">Access requests</h1>
      <button class="quiet" type="button" id="enable-notifications" hidden>Enable browser notifications</button>
      <p id="admin-status" role="status">Loading requests…</p>
      <div id="request-list"></div>
      <section class="activity-section" aria-labelledby="activity-title">
        <h2 id="activity-title">Users and activity</h2>
        <div class="top-actions">
          <label for="activity-user">Username</label>
          <select id="activity-user" disabled></select>
          <button class="quiet" id="activity-refresh" type="button">Refresh</button>
        </div>
        <p id="activity-status" role="status"></p>
        <div id="activity-history" class="activity-history"></div>
        <button class="quiet" id="activity-earlier" type="button" hidden>Load earlier</button>
      </section>
    </main>
  </section>
</body>
</html>
